name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Validator, map layout, colour contrast, syntax (bundle and each file)
      # and data-action handlers, exactly as a local build runs them.
      - name: Build and check
        run: node src/build.js

      # playable.html is committed for GitHub Pages, so it must be the build
      # of the committed sources.
      - name: playable.html matches the sources
        run: git diff --exit-code playable.html

      - name: Type-check the data
        run: npx -y -p typescript@5 tsc -p jsconfig.json

      - name: Browser smoke test
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node src/smoke.js
