name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Validator, map layout, colour contrast, syntax (bundle and each file)
      # and data-action handlers, exactly as a local build runs them.
      - name: Build and check
        run: node src/build.js

      # playable.html and content/ are committed for GitHub Pages, so they must be
      # the build of the committed sources. git status also catches a content
      # file the build wrote that was never committed, and one it removed.
      - name: playable.html and content/ match the sources
        run: |
          changed=$(git status --porcelain -- playable.html content/)
          if [ -n "$changed" ]; then echo "$changed"; echo "::error::playable.html or content/ differs from the build of the committed sources: run node src/build.js and commit the result"; exit 1; fi

      - name: Type-check the data
        run: npx -y -p typescript@5 tsc -p jsconfig.json

      - name: Browser smoke test
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
          node src/smoke.js

      - name: Learning paths test
        run: node src/e2e-paths.js
